.sd .hero{position:relative;overflow:hidden;margin:0 0 16px;padding:20px 24px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--surface);box-shadow:var(--shadow-md)}
.sd .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.sd .hero h2{margin:2px 0 4px;font-size:26px}.sd .hero .sub{margin:0;max-width:70ch}

/* ===== end chat redesign ===== */

(function(){
  const tabs=[...document.querySelectorAll("nav.tabs button[data-tab]")];
  // The Jobs tab's script and data are fetched only the first time the tab is opened.
  let jobsLoading=false;
  const openJobs=()=>{
    if(window.jobsInit)return jobsInit();
    if(jobsLoading)return;
    jobsLoading=true;
    const sc=document.createElement("script");sc.src="jobs.js";
    sc.onload=()=>jobsInit();
    sc.onerror=()=>{jobsLoading=false;document.getElementById("tab-jobs").textContent="Jobs need the local server. In a terminal run: python3 server.py — then open http://localhost:8000"};
    document.head.appendChild(sc);
  };
  // workspace.js (window.WS: test harness, runner, apply helpers) is shared by the AI Pairing and Engineer for a Day tabs.
  let wsCbs=null;
  const loadWorkspace=(ok,fail)=>{
    if(window.WS)return ok();
    if(wsCbs)return wsCbs.push([ok,fail]);
    wsCbs=[[ok,fail]];
    const sc=document.createElement("script");sc.src="workspace.js";
    sc.onload=()=>{const c=wsCbs;wsCbs=null;c.forEach(x=>x[0]())};
    sc.onerror=()=>{const c=wsCbs;wsCbs=null;sc.remove();c.forEach(x=>x[1]())};
    document.head.appendChild(sc);
  };
  // Same lazy-load pattern for the AI Pairing tab.
  let apLoading=false;
  const openAp=()=>{
    if(window.aipairInit)return aipairInit();
    if(apLoading)return;
    apLoading=true;
    const fail=()=>{apLoading=false;document.getElementById("tab-aipair").textContent="AI Pairing needs the local server. In a terminal run: python3 server.py — then open http://localhost:8000"};
    loadWorkspace(()=>{
      const sc=document.createElement("script");sc.src="aipair.js";
      sc.onload=()=>aipairInit();
      sc.onerror=fail;
      document.head.appendChild(sc);
    },fail);
  };
  // And for the Engineer for a Day tab (also needs workspace.js).
  let dayLoading=false;
  const openDay=()=>{
    if(window.dayInit)return dayInit();
    if(dayLoading)return;
    dayLoading=true;
    const fail=()=>{dayLoading=false;document.getElementById("tab-day").textContent="Engineer for a Day needs the local server. In a terminal run: python3 server.py — then open http://localhost:8000"};
    loadWorkspace(()=>{
      const sc=document.createElement("script");sc.src="day.js";
      sc.onload=()=>dayInit();
      sc.onerror=fail;
      document.head.appendChild(sc);
    },fail);
  };
  // And for the Assessment tab.
  let asLoading=false;
  const openAssess=()=>{
    if(window.assessInit)return assessInit();
    if(asLoading)return;
    asLoading=true;
    const sc=document.createElement("script");sc.src="assess.js";
    sc.onload=()=>assessInit();
    sc.onerror=()=>{asLoading=false;document.getElementById("tab-assess").textContent="Assessment needs the local server. In a terminal run: python3 server.py — then open http://localhost:8000"};
    document.head.appendChild(sc);
  };
  // And for the Behavioral tab.
  let bhLoading=false;
  const openBh=()=>{
    if(window.behavioralInit)return behavioralInit();
    if(bhLoading)return;
    bhLoading=true;
    const sc=document.createElement("script");sc.src="behavioral.js";
    sc.onload=()=>behavioralInit();
    sc.onerror=()=>{bhLoading=false;document.getElementById("tab-behavioral").textContent="Behavioral needs the local server. In a terminal run: python3 server.py — then open http://localhost:8000"};
    document.head.appendChild(sc);
  };
  const ind=document.querySelector("nav.tabs .ind");
  const moveInd=(instant)=>{
    const b=document.querySelector("nav.tabs button.on");if(!b)return;
    if(instant){ind.classList.add("noanim")}
    ind.style.width=b.offsetWidth+"px";ind.style.transform="translateX("+b.offsetLeft+"px)";
    if(instant){void ind.offsetWidth;ind.classList.remove("noanim")}
  };
  addEventListener("resize",()=>moveInd(true));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>moveInd(true));
  const show=t=>{
    if(!document.getElementById("tab-"+t))t="leetcode";
    tabs.forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
    tabs.forEach(b=>{const p=document.getElementById("tab-"+b.dataset.tab),h=b.dataset.tab!==t,was=p.hidden;p.hidden=h;if(!h&&was&&ind.dataset.ready){p.classList.remove("tabin");void p.offsetWidth;p.classList.add("tabin")}});
    moveInd();
    if(location.hash.slice(1).split("/")[0]!==t&&(t!=="leetcode"||location.hash))history.replaceState(null,"",t==="leetcode"?location.pathname+location.search:"#"+t);
    if(window.sdRoute)sdRoute();
    if(t==="jobs")openJobs();
    if(t==="aipair")openAp();
    if(t==="day")openDay();
    if(t==="assess")openAssess();
    if(t==="behavioral")openBh();
  };
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab));
  addEventListener("hashchange",()=>show(location.hash.slice(1).split("/")[0]));
  window.showTab=show;
  show(location.hash.slice(1).split("/")[0]);
  moveInd(true);ind.dataset.ready="1";
})();

const cleanProgress=obj=>{
  const out={};
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return out;
  for(const k of Object.keys(obj)){
    const v=obj[k];
    if(!v||typeof v!=="object"||Array.isArray(v))continue;
    const p={done:v.done===true,times:Number.isInteger(v.times)&&v.times>0?v.times:0};
    if(typeof v.note==="string"&&v.note)p.note=v.note;
    if(typeof v.last==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v.last))p.last=v.last;
    if(p.done||p.times||p.note)out[k]=p;
  }

};

// Minimal, safe markdown for AI replies (code fences, lists, headings, **bold**, `code`) — built with DOM nodes, never innerHTML.
function renderMd(node,text){
  node.classList.add("md");node.replaceChildren();
  const inline=(parent,t)=>{
    t.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(seg=>{
      if(!seg)return;
      if(seg.length>2&&seg[0]==="`")parent.appendChild(el("code",null,seg.slice(1,-1)));
      else if(seg.length>4&&seg.startsWith("**"))parent.appendChild(el("strong",null,seg.slice(2,-2)));
      else parent.appendChild(document.createTextNode(seg));
    });
  };
  text.split(/```/).forEach((part,i)=>{
    if(i%2){
      const nl=part.indexOf("\n"),pre=el("pre");
      pre.appendChild(el("code",null,(nl<0?part:part.slice(nl+1)).replace(/\n$/,"")));node.appendChild(pre);return;
    }
    let list=null,para=null;
    const flush=()=>{list=null;para=null};
    part.split("\n").forEach(line=>{
      const li=line.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/),hd=line.match(/^#{1,6}\s+(.*)/);
      if(!line.trim()){flush();return}
      if(li){
        const ord=/^\s*\d/.test(line);
        if(!list||list.tagName!==(ord?"OL":"UL")){list=el(ord?"ol":"ul");node.appendChild(list)}
        para=null;const it=el("li");inline(it,li[1]);list.appendChild(it);return;
      }
      list=null;
      if(hd){const p=el("p");const b=el("strong");inline(b,hd[1]);p.appendChild(b);node.appendChild(p);para=null;return}
      if(!para){para=el("p");node.appendChild(para)}else para.appendChild(document.createElement("br"));
      inline(para,line);
    });
  });
}
async function sendChat(text,shown){
  if(!text||chatBusy)return;
  chatBusy=true;
  const log=$("clog"),slug=learnSlug,gen=chatGen,ac=chatAbort=new AbortController();
  chatMsgs.push({role:"user",content:text});
  log.appendChild(el("div","m u",shown||text));
  const out=el("div","m busy","Thinking…");log.appendChild(out);
  // Keep the newest message in view: jump after Send, then follow the stream only while the reader stays near the end.
  const follow=force=>{
    if(log.scrollHeight>log.clientHeight){if(force||log.scrollHeight-log.scrollTop-log.clientHeight<160)log.scrollTop=log.scrollHeight}
    else if(force||out.getBoundingClientRect().bottom-innerHeight<160)out.scrollIntoView({block:"nearest"});
  };
  follow(true);
  let answer="";
  try{
    const res=await apiFetch("/api/chat",{method:"POST",body:JSON.stringify({slug,lang:learnLang,messages:chatMsgs}),signal:ac.signal});
    if(!res.ok){const d=await res.json();throw new Error(d.error||"Request failed")}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n");buf=parts.pop();
      for(const p of parts){
        if(!p.startsWith("data: "))continue;
        const ev=JSON.parse(p.slice(6));
        if(ev.error)throw new Error(ev.error);
        if(ev.t){answer+=ev.t;out.classList.remove("busy");renderMd(out,answer);if(log.isConnected)follow(false)}
      }
    }
    if(gen!==chatGen)return;
    chatMsgs.push({role:"assistant",content:answer||"(no answer)"});
  }catch(err){
    if(gen!==chatGen)return;
    chatMsgs.pop();
    out.classList.remove("busy");out.textContent=errMsg(err);out.classList.add("warn");
  }
  chatAbort=null;chatBusy=false;
}

function makeEditor(host,{doc,value,run}={}){
  const keys={
    Tab:cm=>cm.execCommand(cm.somethingSelected()?"indentMore":"insertSoftTab"),"Shift-Tab":"indentLess",
    "Ctrl-Space":"autocomplete","Cmd-/":"toggleComment","Ctrl-/":"toggleComment","Shift-Alt-F":cm=>formatCode(cm)};

    autoCloseBrackets:"()[]{}''\"\"``",matchBrackets:true,styleActiveLine:true,foldGutter:true,gutters:["CodeMirror-linenumbers","CodeMirror-foldgutter"],extraKeys:keys});
  // Follow the light/dark toggle, and stop watching once the editor has been thrown away.
  const obs=new MutationObserver(()=>{if(!cm.getWrapperElement().isConnected)obs.disconnect();else cm.setOption("theme",theme())});

// Reformat the JavaScript in editor `cm` with Prettier. Keeps the cursor, scroll position and undo history, and says what happened in a note above the code.
async function formatCode(cm){
  const say=(msg,ms)=>cm.openNotification(msg,{duration:ms||2500});
  const doc=cm.getDoc();
  if(cm.getOption("readOnly"))return say("This file is read-only.");
  if(doc.modeOption!=="javascript")return say("Format works on JavaScript files only.");
  try{await loadPrettier()}catch(e){return say("Could not load the formatter from the CDN. It needs internet.",5000)}
  const src=doc.getValue();
  if(cm.getDoc()!==doc||cm.getOption("readOnly"))return;
  let out;
  try{out=prettier.formatWithCursor(src,{parser:"babel",plugins:prettierPlugins,tabWidth:2,printWidth:100,cursorOffset:doc.indexFromPos(doc.getCursor())})}
  catch(e){
    const at=e.loc&&e.loc.start;
    if(at)doc.setCursor({line:at.line-1,ch:Math.max(0,at.column-1)});
    return say("Could not format: "+String(e.message).split("\n")[0].replace(/\s*\(\d+:\d+\)$/,"")+(at?" (line "+at.line+")":""),6000);
  }
  if(out.formatted===src)return say("Already formatted.");
  const top=cm.getScrollInfo();
  cm.operation(()=>{
    const last=doc.lastLine();
    doc.replaceRange(out.formatted,{line:0,ch:0},{line:last,ch:doc.getLine(last).length});
    doc.setCursor(doc.posFromIndex(out.cursorOffset));
    cm.scrollTo(top.left,top.top);
  });
  say("Formatted.");
}

// Runs inside the worker, appended to the learner's code in one script so it can see their top-level
// `const`/`class` declarations via direct eval. Locals are __-prefixed so they cannot shadow the learner's names.
function harness(spec){
  const __show=v=>{try{const j=JSON.stringify(v);const s=j===undefined?String(v):j;return s.length>400?s.slice(0,400)+"…":s}catch(e){return String(v)}};
  const __canon=(v,un)=>{
    if(v===undefined)return null;
    if(Array.isArray(v)){const a=v.map(x=>__canon(x,un));return un?a.sort((x,y)=>{const p=JSON.stringify(x),q=JSON.stringify(y);return p<q?-1:p>q?1:0}):a}
    if(v&&typeof v==="object"){const o={};Object.keys(v).sort().forEach(k=>{o[k]=__canon(v[k],un)});return o}
    return v;
  };
  const __eq=(a,b)=>{
    if(typeof a==="number"&&typeof b==="number"){
      if(Number.isInteger(a)&&Number.isInteger(b))return a===b;
      return Math.abs(a-b)<=1e-5*Math.max(1,Math.abs(b));
    }
    if(Array.isArray(a)&&Array.isArray(b))return a.length===b.length&&a.every((x,i)=>__eq(x,b[i]));
    if(a&&b&&typeof a==="object"&&typeof b==="object"){const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>__eq(a[k],b[k]))}
    return a===b;
  };
  const __mkList=a=>{
    if(a==null)return null;
    let h=null;
    for(let i=a.length-1;i>=0;i--){const n=typeof ListNode!=="undefined"?new ListNode(a[i]):{};n.val=a[i];n.next=h;h=n}
    return h;
  };
  const __mkTree=a=>{
    if(!a||a[0]==null)return null;
    const mk=v=>{const n=typeof TreeNode!=="undefined"?new TreeNode(v):{};n.val=v;n.left=null;n.right=null;return n};
    const root=mk(a[0]),q=[root];let i=1;
    while(q.length&&i<a.length){
      const n=q.shift();
      if(i<a.length&&a[i]!=null){n.left=mk(a[i]);q.push(n.left)}i++;
      if(i<a.length&&a[i]!=null){n.right=mk(a[i]);q.push(n.right)}i++;
    }
    return root;
  };
  const __listArr=h=>{const o=[];while(h&&o.length<1e5){o.push(h.val);h=h.next}return o};
  const __treeArr=r=>{
    if(!r)return[];
    const o=[],q=[r];
    while(q.length&&o.length<1e5){const n=q.shift();if(n==null)o.push(null);else{o.push(n.val);q.push(n.left==null?null:n.left,n.right==null?null:n.right)}}
    while(o.length&&o[o.length-1]===null)o.pop();
    return o;
  };
  const __in=(v,t)=>t==="list"?__mkList(v):t==="tree"?__mkTree(v):v;
  const __out=(v,t)=>t==="list"?__listArr(v):t==="tree"?__treeArr(v):v;
  let __target;
  try{__target=eval(spec.name)}catch(e){__target=undefined}
  if(typeof __target!=="function"){postMessage({t:"fatal",s:"Define "+(spec.kind==="class"?"class ":"function ")+spec.name+" (not found)."});return}
  const __un=spec.compare==="unordered";
  spec.tests.forEach((t,i)=>{
    let got,err=null,exp;
    try{
      exp=t.expected==null?undefined:JSON.parse(t.expected);
      const input=JSON.parse(t.input);
      if(spec.kind==="class"){
        got=[];let inst=null;
        input.ops.forEach((op,k)=>{
          const args=input.args[k]||[];
          if(k===0){inst=new __target(...args);got.push(null)}
          else{const r=inst[op](...args);got.push(r===undefined?null:r)}
        });
      }else{
        const args=input.map((a,k)=>__in(a,spec.argTypes[k]||"plain"));
        const r=__target(...args);
        got=spec.compare==="first_arg_mutated"?__out(args[0],spec.argTypes[0]||"plain"):__out(r,spec.returnType);
      }
    }catch(e){err=String(e&&e.stack||e).split("\n").slice(0,4).join("\n")}
    const pass=err!=null?false:exp===undefined?null:__eq(__canon(got,__un),__canon(exp,__un));
    postMessage({t:"case",i,pass,got:err==null?__show(got):"",expected:exp===undefined?"":__show(exp),err});
  });
}

// Runs `code` against the exercise's tests in a fresh worker. Resolves {cases, fatal, err, timedOut}; onOut gets console output.
function runTests(code,ex,opt={}){
  const {onOut,onStart,custom=[]}=opt;
  return new Promise(resolve=>{
    const w=new Worker("/worker.js"),res={cases:[],fatal:"",err:"",timedOut:false};
    let timer=0,finished=false;
    const stop=()=>{res.err=res.err||"Stopped.";end()};
    const end=()=>{if(finished)return;finished=true;clearTimeout(timer);w.terminate();if(pKill===stop)pKill=null;resolve(res)};
    pKill=stop;
    w.onmessage=e=>{
      const m=e.data;
      if(m.t==="start"){if(onStart)onStart();timer=setTimeout(()=>{res.timedOut=true;end()},RUN_TIMEOUT)}
      else if(m.t==="out"){if(onOut)onOut(m.s)}
      else if(m.t==="case")res.cases[m.i]=m;
      else if(m.t==="fatal")res.fatal=m.s;
      else if(m.t==="err")res.err+=m.s+"\n";
      else if(m.t==="done")end();
    };
    w.onerror=e=>{res.err+=(e.message||"Worker error")+"\n";end()};
    const spec={name:ex.function_name,kind:ex.kind,compare:ex.compare,argTypes:ex.arg_types,returnType:ex.return_type,
      tests:allTests(ex,custom).map(t=>({input:t.input_json,expected:t.expected_json}))};
    w.postMessage(code+"\n;("+harness.toString()+")("+JSON.stringify(spec)+");");
  });
}

// Built-in tests plus the learner's custom ones (expected_json null = show the output only, no pass/fail).
const allTests=(ex,custom)=>ex.tests.concat(custom.map((t,k)=>({name:`custom ${k+1}`,input_json:t.input.trim(),expected_json:t.expected.trim()||null,custom:true})));
let pLast="",pLastKey="",pRevGen=0,pSlug="",pDoc=null,pCustom=[],pEd=null,pKill=null,pRunning=false;
const draftKey=slug=>`leetcode-draft-${slug}-javascript`;
const readDraft=slug=>{try{return localStorage.getItem(draftKey(slug))}catch(e){return null}};
const writeDraft=(slug,v)=>{try{localStorage.setItem(draftKey(slug),v)}catch(e){}};
// Identifies what a test run covered, so a review can tell whether pLast still describes the editor's code.
const runKey=(code,custom)=>JSON.stringify([code,custom.map(t=>[t.input.trim(),t.expected.trim()])]);
function summarize(tests,r){
  if(r.fatal)return "error: "+r.fatal;
  const graded=tests.filter(t=>t.expected_json!=null).length,passed=tests.filter((t,i)=>r.cases[i]&&r.cases[i].pass===true).length;
  const fails=tests.map((t,i)=>[t,r.cases[i]]).filter(([t,c])=>c&&c.pass===false).slice(0,5).map(([t,c])=>`${t.name}: input ${t.input_json.slice(0,150)} got ${String(c.err||c.got).slice(0,150)} expected ${String(c.expected||"").slice(0,150)}`);
  return `${passed}/${graded} passed`+(r.timedOut?"; timed out":"")+(fails.length?"; failures: "+fails.join(" | "):"");
}
async function reviewCode(){
  if(!pEd||!pDoc)return;
  if(pRunning)return;
  const slug=pSlug,gen=++pRevGen,box=$("prev-out"),btn=$("preview");
  const code=pEd.getValue();
  if(!code.trim())return;
  box.hidden=false;box.replaceChildren(el("h4",null,"AI review"));
  const out=el("div","busy","Reviewing your solution…");box.appendChild(out);
  btn.disabled=true;let text="";
  try{
    // The review must see results for exactly this code (and these custom tests), so re-run the tests if anything changed since the last run.
    if(pLastKey!==runKey(code,pCustom.filter(t=>t.input.trim()))){
      out.textContent="Running tests on your current code…";
      await runEditor();
      if(gen!==pRevGen)return;
      if(slug!==pSlug||pLastKey!==runKey(code,pCustom.filter(t=>t.input.trim())))throw new Error("The code or tests changed while the tests were running. Click Review again.");
      out.textContent="Reviewing your solution…";
    }
    const res=await apiFetch("/api/practice/review",{method:"POST",body:JSON.stringify({slug,code,results:pLast})});
    if(!res.ok){const d=await res.json();throw new Error(d.error||"Request failed")}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n");buf=parts.pop();
      for(const p of parts){
        if(!p.startsWith("data: "))continue;
        const ev=JSON.parse(p.slice(6));
        if(ev.error)throw new Error(ev.error);
        if(ev.t&&gen===pRevGen){text+=ev.t;out.classList.remove("busy");out.textContent=text}
      }
    }
  }catch(err){
    if(gen===pRevGen){out.classList.remove("busy");out.classList.add("warn");out.textContent=errMsg(err)}
  }
  if(gen===pRevGen)btn.disabled=false;
}
function renderResults(tests,r){
  const box=$("pres");box.replaceChildren();
  if(r.fatal){box.appendChild(el("div","bad",r.fatal));return}
  const graded=tests.filter(t=>t.expected_json!=null).length;
  const passed=tests.filter((t,i)=>r.cases[i]&&r.cases[i].pass===true).length;
  box.appendChild(el("div",passed===graded?"sum ok":"sum",`${passed} / ${graded} tests passed`+(passed===graded&&graded?" 🎉":"")));
  if(r.err)box.appendChild(el("pre","bad",r.err.trim()));
  if(r.timedOut)box.appendChild(el("div","bad",`Stopped: exceeded ${RUN_TIMEOUT/1000}s (infinite loop or too slow?). Tests after the stuck one did not run.`));
  tests.forEach((t,i)=>{
    const c=r.cases[i],d=el("div","t"),label=`${i+1}. ${t.name}`;
    if(!c){d.appendChild(el("span","m",`– ${label} (not run)`));box.appendChild(d);return}
    const inp=`input:    ${t.input_json.length>300?t.input_json.slice(0,300)+"…":t.input_json}`;
    if(c.pass===null){
      d.appendChild(el("span","m","ℹ "+label+" (no expected value)"));
      d.appendChild(el("pre",null,inp+"\ngot:      "+c.got));
    }else{
      d.appendChild(el("span",c.pass?"ok":"bad",(c.pass?"✓ ":"✗ ")+label));
      if(!c.pass)d.appendChild(el("pre",null,[inp,c.err?`error:    ${c.err}`:`got:      ${c.got}`,c.expected?`expected: ${c.expected}`:""].filter(Boolean).join("\n")));
    }
    box.appendChild(d);
  });
}

// Custom tests: the learner's own inputs, saved per problem. Input uses the same JSON shape as the built-in tests.
const customKey=slug=>`leetcode-custom-${slug}`;
function loadCustom(slug){
  try{const v=JSON.parse(localStorage.getItem(customKey(slug))||"[]");return Array.isArray(v)?v.filter(t=>t&&typeof t.input==="string"&&typeof t.expected==="string"):[]}catch(e){return[]}
}
const saveCustom=()=>{try{localStorage.setItem(customKey(pSlug),JSON.stringify(pCustom))}catch(e){}};
function renderCustom(focusLast){
  const list=$("pclist");list.replaceChildren();
  $("pccount").textContent=pCustom.length?`(${pCustom.length})`:"";
  const example=pDoc?pDoc.exercise.tests[0].input_json:"";
  const field=(t,key,ph)=>{const f=el("input");f.type="text";f.value=t[key];f.placeholder=ph;f.autocomplete="off";f.spellcheck=false;f.oninput=()=>{t[key]=f.value;saveCustom()};return f};
  pCustom.forEach((t,i)=>{
    const row=el("div","crow"),del=el("button",null,"✕");
    del.title="Remove this test";del.onclick=()=>{pCustom.splice(i,1);saveCustom();renderCustom()};
    row.append(field(t,"input","input, e.g. "+example),field(t,"expected","expected (optional)"),del);
    list.appendChild(row);
  });
  if(focusLast&&list.lastChild)list.lastChild.firstChild.focus();
}

function setBusy(on,msg){pRunning=on;$("prun").hidden=on;$("pstop").hidden=!on;$("pstat").textContent=msg||"";$("pstat").classList.toggle("busy",on)}
async function runEditor(){
  if(pRunning||!pEd||!pDoc)return;
  const ex=pDoc.exercise,slug=pSlug;
  writeDraft(slug,pEd.getValue());
  $("pcon").replaceChildren();$("pres").replaceChildren();
  setBusy(true,"Running…");
  const custom=pCustom.filter(t=>t.input.trim()),code=pEd.getValue();
  const r=await runTests(code,ex,{custom,onOut:s=>{$("pcon").appendChild(document.createTextNode(s));$("pcon").scrollTop=1e9}});
  if(slug!==pSlug)return;
  setBusy(false);
  if(pDoc&&pDoc.exercise===ex){pLast=summarize(allTests(ex,custom),r);pLastKey=runKey(code,custom)}
  renderResults(allTests(ex,custom),r);
}

// The model's expected outputs can be wrong, so run its own reference solution against them once per open.
async function checkTests(doc,slug){
  const r=await runTests(doc.exercise.reference_solution,doc.exercise);
  if(slug!==pSlug)return;
  const bad=doc.exercise.tests.map((t,i)=>[t,i]).filter(([t,i])=>!(r.cases[i]&&r.cases[i].pass)).map(([t,i])=>i+1);
  if(r.fatal||bad.length||r.timedOut){
    const w=el("div","warn",`⚠ The AI reference solution failed ${r.fatal||r.timedOut?"the test run":`test${bad.length>1?"s":""} ${bad.join(", ")}`}, so some tests (or the statement) may be wrong. Try Regenerate if a correct solution fails.`);
    $("pstmt").prepend(w);
  }
}

// Derive "name(arg: type, ...) → ret" lines from LeetCode-style starter code (JSDoc @param/@return + function heads).
function signatures(code){
  const out=[],re=/(?:(?:var|let|const)\s+(\w+)|(\w+\.prototype\.\w+))\s*=\s*function\s*\(([^)]*)\)/g;let m,last=0;
  while((m=re.exec(code))){
    const docs=[...code.slice(last,m.index).matchAll(/\/\*\*[\s\S]*?\*\//g)].pop();last=re.lastIndex;
    const d=docs?docs[0]:"",ty={};for(const p of d.matchAll(/@param\s+\{([^}]+)\}\s+(\w+)/g))ty[p[2]]=p[1];
    const ret=(d.match(/@return[s]?\s+\{([^}]+)\}/)||[])[1];
    const args=m[3].split(",").map(x=>x.trim()).filter(Boolean).map(n=>ty[n]?`${n}: ${ty[n]}`:n).join(", ");
    const name=(m[1]||m[2]).replace(".prototype.",".");
    const isCtor=!!m[1]&&/^[A-Z]/.test(m[1]);
    out.push(isCtor?`new ${name}(${args})`:`${name}(${args})${ret?` \u2192 ${ret}`:""}`);
  }
  return out;
}

function showExercise(doc){
  pDoc=doc;pLast="";pLastKey="";const ex=doc.exercise,slug=pSlug;
  const st=$("pstmt");st.replaceChildren();
  if(ex.statement_note)st.appendChild(el("div","warn","⚠ "+ex.statement_note));
  st.appendChild(document.createTextNode(ex.statement));
  const sg=signatures(ex.starter_code);
  if(sg.length){const h=el("div","sig");h.appendChild(el("b",null,ex.kind==="class"?"Class to implement":"Function signature"));h.appendChild(el("pre",null,sg.join("\n")));st.appendChild(h)}
  st.appendChild(el("div","meta",`AI-generated (${doc.model}, ${doc.generated_at.slice(0,10)}). Verify against the actual problem.`));
  pCustom=loadCustom(slug);renderCustom();
  $("pchint").textContent=pDoc.exercise.kind==="class"?"input: {\"ops\":[…],\"args\":[…]}":"input: a JSON array of the arguments";
  pEd.setValue(readDraft(slug)??ex.starter_code);pEd.clearHistory();
  $("prun").disabled=false;$("preset").disabled=false;$("preview").disabled=false;$("pregen").hidden=false;
  pEd.refresh();pEd.focus();
  checkTests(doc,slug);
}
async function loadExercise(url,opts){
  const slug=pSlug;
  $("pstmt").replaceChildren(el("p","meta busy","Generating exercise and tests… the first time takes up to a minute; it's cached afterwards."));
  $("prun").disabled=true;$("preset").disabled=true;$("preview").disabled=true;$("pregen").hidden=true;
  try{
    const res=await apiFetch(url,opts);
    if(slug!==pSlug)return;
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Request failed");
    showExercise(data);
  }catch(err){
    if(slug!==pSlug)return;
    $("pstmt").replaceChildren(el("p","warn",errMsg(err)));
    const retry=el("button",null,"Retry");retry.onclick=()=>loadExercise(url,opts);$("pstmt").appendChild(retry);
  }
}
async function openPractice(slug){
  const r=DATA.find(x=>x[6]===slug);
  if(pRunning&&pKill)pKill();
  pSlug=slug;pDoc=null;pCustom=[];pLast="";pLastKey="";pRevGen++;$("preview").disabled=true;$("prev-out").hidden=true;$("pclist").replaceChildren();$("pccount").textContent="";
  $("pt").textContent=`${r[2]} · ${DN[r[1]]}`;
  $("pcon").replaceChildren();$("pres").replaceChildren();$("pstat").textContent="";$("pstmt").replaceChildren();
  $("pdlg").showModal();
  if(location.protocol==="file:"){$("pstmt").replaceChildren(el("p","warn",NO_SERVER));return}
  try{
    await loadCM();
    if(slug!==pSlug)return;
    if(!pEd){
      pEd=makeEditor($("ped"),{run:runEditor});
      pEd.on("change",()=>{if(pDoc)writeDraft(pSlug,pEd.getValue())});

    loadExercise(`/api/practice?slug=${encodeURIComponent(slug)}`);
  }catch(err){$("pstmt").replaceChildren(el("p","warn",(err.message||String(err))+" (the editor loads from a CDN, so it needs internet)"))}
}
